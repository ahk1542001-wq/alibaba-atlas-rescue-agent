name: CI Test Suite

on:
  push:
    branches: [ main, master, feature/trip-agent ]
  pull_request:
    branches: [ main, master ]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node (for the JS syntax gate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The V2 (qwen-agent brain) tests import services.qwen_brain at
          # collection time, so the v2 dependency set MUST be installed or
          # pytest aborts with ModuleNotFoundError before a single test runs.
          # requirements-v2.txt also pins qwen-agent's undeclared runtime
          # imports (numpy/soundfile/tqdm/python-dateutil) needed to import it.
          pip install -r requirements.txt -r requirements-v2.txt
          pip install pip-audit

      - name: Install pre-commit hook (security gate 3/6)
        # security_check.sh section 3/6 asserts the local pre-commit hook is
        # installed and executable. A fresh CI checkout has no .git/hooks, so
        # install it from the tracked scripts/pre-commit (the same banned-
        # pattern scan the hook runs). This keeps gate 3/6 honest, not skipped.
        run: bash scripts/security_check.sh --install-hook

      - name: Security & Audit Gate
        run: bash scripts/security_check.sh

      - name: Run Non-UI Test Suite
        # -rs surfaces every skip reason in the CI summary (no silent skips):
        # e.g. the conditional 'mockdata' marker reports why it skipped.
        run: TZ=UTC python -m pytest tests/ -q --ignore=tests/test_ui_trip.py -rs

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node (for the JS syntax gate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI Test Suite (port 8050)
        run: TZ=UTC python -m pytest tests/test_ui_trip.py -q
